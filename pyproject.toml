[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-signage-portfolio"
version = "0.1.0"
description = "Selected C++/Qt display and event-driven content synchronization code"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "websockets>=15,<16", "pydantic>=2.11,<3"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "fastapi>=0.116,<1", "uvicorn>=0.35,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_signage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
