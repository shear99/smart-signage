<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#55758d"/></marker></defs><rect width="1280" height="560" fill="#f4f7fb"/><text x="48" y="62" font-family="sans-serif" font-size="30" font-weight="700" fill="#152a3c">콘텐츠 적용 흐름 · 완성되기 전에는 화면을 바꾸지 않기</text><path d="M288 220 L358 220" stroke="#55758d" stroke-width="3" marker-end="url(#a)"/><path d="M598 220 L668 220" stroke="#55758d" stroke-width="3" marker-end="url(#a)"/><path d="M908 220 L978 220" stroke="#55758d" stroke-width="3" marker-end="url(#a)"/><path d="M478 300 L478 365" stroke="#55758d" stroke-width="3" marker-end="url(#a)"/><text x="478.0" y="320.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#506579">실패</text><path d="M1103 300 L860 365" stroke="#55758d" stroke-width="3" marker-end="url(#a)"/><text x="981.5" y="320.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#506579">파싱 실패</text><rect x="48" y="155" width="240" height="145" rx="14" fill="white" stroke="#327ca1" stroke-width="2"/><rect x="48" y="169" width="5" height="117" fill="#327ca1"/><text x="70" y="193" font-family="sans-serif" font-size="21" font-weight="700" fill="#142b3e">1. 다운로드</text><text x="70" y="225" font-family="sans-serif" font-size="17" fill="#476174">staging에 파일 준비</text><text x="70" y="250" font-family="sans-serif" font-size="17" fill="#476174">기존 화면은 계속 사용</text><rect x="358" y="155" width="240" height="145" rx="14" fill="white" stroke="#327ca1" stroke-width="2"/><rect x="358" y="169" width="5" height="117" fill="#327ca1"/><text x="380" y="193" font-family="sans-serif" font-size="21" font-weight="700" fill="#142b3e">2. 전체 검증</text><text x="380" y="225" font-family="sans-serif" font-size="17" fill="#476174">manifest · 파일 hash</text><text x="380" y="250" font-family="sans-serif" font-size="17" fill="#476174">완성된 bundle 보관</text><rect x="668" y="155" width="240" height="145" rx="14" fill="white" stroke="#e69738" stroke-width="2"/><rect x="668" y="169" width="5" height="117" fill="#e69738"/><text x="690" y="193" font-family="sans-serif" font-size="21" font-weight="700" fill="#142b3e">3. 활성화</text><text x="690" y="225" font-family="sans-serif" font-size="17" fill="#476174">active.json 원자 교체</text><text x="690" y="250" font-family="sans-serif" font-size="17" fill="#476174">단일 commit 지점</text><rect x="978" y="155" width="250" height="145" rx="14" fill="white" stroke="#327ca1" stroke-width="2"/><rect x="978" y="169" width="5" height="117" fill="#327ca1"/><text x="1000" y="193" font-family="sans-serif" font-size="21" font-weight="700" fill="#142b3e">4. Qt 표시</text><text x="1000" y="225" font-family="sans-serif" font-size="17" fill="#476174">계약 파싱 성공 시 반영</text><text x="1000" y="250" font-family="sans-serif" font-size="17" fill="#476174">재생 경계에서 목록 전환</text><rect x="358" y="365" width="550" height="100" rx="14" fill="white" stroke="#647c8e" stroke-width="2"/><rect x="358" y="379" width="5" height="72" fill="#647c8e"/><text x="380" y="403" font-family="sans-serif" font-size="21" font-weight="700" fill="#142b3e">검증 또는 파싱 실패</text><text x="380" y="435" font-family="sans-serif" font-size="17" fill="#476174">새 snapshot을 게시하지 않고 마지막 정상 콘텐츠를 유지</text><text x="48" y="524" font-family="sans-serif" font-size="17" fill="#51697c">공개본의 합성 테스트로 활성 포인터 보존과 C++ snapshot 유지 경계를 확인합니다.</text></svg>